[project]
name = "institutional-forms"
version = "0.1.0"
description = "Plataforma institucional de formularios dinámicos"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django>=5.2.12,<5.3",
  "django-unfold>=0.80,<1",
  "dj-database-url>=3,<4",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
  "pillow>=11,<13",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<1",
  "django-storages[s3]>=1.14.6,<2",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]
