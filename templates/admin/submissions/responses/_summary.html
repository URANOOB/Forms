<nav class="response-status-summary" aria-label="Filtrar respuestas por estado">{% for status in status_cards %}<a href="{{ status.url }}" class="response-status-card" data-status="{{ status.value }}" {% if status.active %}aria-current="page"{% endif %}><span class="response-status-icon material-symbols-outlined" aria-hidden="true">{% if status.value == 'SUBMITTED' %}inbox{% elif status.value == 'UNDER_REVIEW' %}schedule{% elif status.value == 'VALIDATED' %}check_circle{% else %}block{% endif %}</span><span><strong>{{ status.count }}</strong><b>{{ status.label }}</b><small>{{ status.help }}</small></span></a>{% endfor %}</nav>
