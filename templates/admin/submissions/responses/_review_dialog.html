<dialog id="review-dialog" class="review-dialog" aria-labelledby="review-dialog-title"><div class="review-heading"><div><span class="response-eyebrow">CAMBIAR ESTADO</span><h2 id="review-dialog-title">Revisar respuesta</h2><p id="review-dialog-response"></p></div><button type="button" data-close-review aria-label="Cerrar">×</button></div><form method="post" class="review-form" data-review-form id="board-review-form">{% csrf_token %}<input type="hidden" name="revision"><label for="board-review-status">Acción<select id="board-review-status" name="status" required></select></label><label for="board-review-note"><span data-note-label>Nota sobre el cambio</span><textarea id="board-review-note" name="note" rows="4" maxlength="2000" placeholder="Añade contexto para el historial de esta respuesta"></textarea></label><p class="review-hint">Puedes explicar el cambio de estado. El motivo es obligatorio al rechazar.</p><p class="review-errors" role="alert" id="review-error" hidden></p><a href="" id="review-reload" hidden>Actualizar tablero</a><div class="review-dialog-actions"><button type="button" data-close-review>Cancelar</button><button type="submit" class="review-primary">Guardar estado</button></div></form></dialog>
