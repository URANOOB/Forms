<form method="get" class="response-work-filters" aria-label="Buscar y filtrar respuestas">
    <input type="hidden" name="view" value="{{ response_layout }}">
    <label class="response-filter-search"><span>Buscar en respuestas</span><input type="search" name="q" value="{{ cl.query }}" placeholder="Cualquier palabra de la respuesta…"></label>
    <div class="response-select-field"><span id="response-status-label">Estado</span><select name="response_status" aria-labelledby="response-status-label"><option value="">Todos</option>{% for status in status_cards %}<option value="{{ status.value }}" {% if work_filter_values.response_status == status.value %}selected{% endif %}>{{ status.label }}</option>{% endfor %}</select></div>
    <div class="response-select-field response-form-field"><span id="response-form-label">Formulario</span><select name="response_form" aria-labelledby="response-form-label"><option value="">Todos los formularios</option>{% for form in filter_form_choices %}<option value="{{ form.id }}" {% if work_filter_values.response_form == form.id %}selected{% endif %}>{{ form.name }}</option>{% endfor %}</select></div>
    <div class="response-date-field"><span id="response-from-label">Desde</span><input type="date" name="response_from" value="{{ work_filter_values.response_from }}" aria-labelledby="response-from-label"></div>
    <div class="response-date-field"><span id="response-to-label">Hasta</span><input type="date" name="response_to" value="{{ work_filter_values.response_to }}" aria-labelledby="response-to-label"></div>
    <div class="response-select-field"><span id="response-assignee-label">Asignado a</span><select name="response_assignee" aria-labelledby="response-assignee-label"><option value="">Todos</option><option value="unassigned" {% if work_filter_values.response_assignee == 'unassigned' %}selected{% endif %}>Sin asignar</option>{% for user in filter_assignee_choices %}<option value="{{ user.id }}" {% if work_filter_values.response_assignee == user.id %}selected{% endif %}>{{ user.name }}</option>{% endfor %}</select></div>
    <div class="response-select-field"><span id="response-order-label">Ordenar por</span><select name="response_order" aria-labelledby="response-order-label"><option value="newest" {% if work_filter_values.response_order != 'oldest' %}selected{% endif %}>Más recientes primero</option><option value="oldest" {% if work_filter_values.response_order == 'oldest' %}selected{% endif %}>Más antiguas primero</option></select></div>
    <label class="response-filter-documents"><input type="checkbox" name="response_documents" value="1" {% if work_filter_values.response_documents == '1' %}checked{% endif %}>Con documentos</label>
    <a href="{{ clear_url }}" class="response-filter-clear">Limpiar</a>
    <button type="submit" class="response-filter-submit"><span class="material-symbols-outlined" aria-hidden="true">search</span>Aplicar filtros</button>
</form>
