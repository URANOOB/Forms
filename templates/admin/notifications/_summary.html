<section class="email-metrics" aria-label="Métricas de correo para los filtros seleccionados">
    <article><span class="email-metric-icon material-symbols-outlined" aria-hidden="true">send</span><div><strong>{{ metrics.sent }}</strong><p>Enviados hoy</p></div></article>
    <article><span class="email-metric-icon delivered material-symbols-outlined" aria-hidden="true">check_circle</span><div><strong>{{ metrics.delivered }}</strong><p>Entregados</p></div></article>
    <article><span class="email-metric-icon pending material-symbols-outlined" aria-hidden="true">schedule</span><div><strong>{{ metrics.pending }}</strong><p>Pendientes</p></div></article>
    <article><span class="email-metric-icon failed material-symbols-outlined" aria-hidden="true">error</span><div><strong>{{ metrics.failed }}</strong><p>Fallidos</p></div></article>
</section>
