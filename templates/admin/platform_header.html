{% load static %}
<header id="platform-topbar" class="platform-topbar" data-activity-url="{% url 'platform_activity' %}">
    <div class="platform-topbar-title">
        {% if is_nav_sidebar_enabled %}<button type="button" class="platform-nav-toggle" x-on:click="sidebarToggle()" aria-label="Abrir o cerrar navegación"><svg class="platform-shell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button>{% endif %}
        <span>{{ platform_section }}</span>
    </div>
    <form class="platform-global-search" action="{% url 'platform_search' %}" method="get" role="search" autocomplete="off">
        <svg class="platform-shell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input type="search" name="q" value="{{ query|default:'' }}" placeholder="Buscar en toda la plataforma" aria-label="Buscar en toda la plataforma" maxlength="120">
        <div class="platform-search-suggestions" hidden></div>
    </form>
    <div class="platform-topbar-actions">
        <div class="platform-notifications">
            <button type="button" class="platform-notifications-button" aria-label="Notificaciones" aria-expanded="false" aria-controls="platform-notifications-panel" title="Notificaciones">
                <svg class="platform-shell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
                <span class="platform-notification-count" hidden></span>
            </button>
            <div id="platform-notifications-panel" class="platform-notifications-panel" hidden>
                <div class="platform-notifications-heading"><strong>Actividad reciente</strong><svg class="platform-shell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16l2 10v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/><path d="M2 14h6l2 3h4l2-3h6"/></svg></div>
                <div class="platform-notifications-list" aria-live="polite"><p>Cargando actividad…</p></div>
            </div>
        </div>
    </div>
    <span class="platform-activity-announcement" aria-live="polite"></span>
    <div hidden>{% csrf_token %}</div>
</header>
