{% if field %}<div class="users-field {% if field.errors %}users-field-invalid{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-label="obligatorio"> *</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="users-field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
    {{ field.errors }}
</div>{% endif %}
