services:
  app:
    profiles: [app]
    build:
      context: .
      dockerfile: deployment/Dockerfile.dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,[::1]
      DJANGO_TIME_ZONE: America/Bogota
      DATABASE_URL: postgresql://forms:forms_local_only@db:5432/forms
      FILE_STORAGE: local
      EMAIL_NOTIFICATIONS_ENABLED: "False"
      PYTHON_DOTENV_DISABLED: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=5).close()"]
      interval: 5s
      timeout: 6s
      start_period: 10s
      retries: 10
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: forms
      POSTGRES_USER: forms
      POSTGRES_PASSWORD: forms_local_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - forms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forms -d forms"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  forms_postgres:
